# Source registry for Northfield Labs content.
#
# One entry per topic. If a topic isn't here, the pipeline doesn't have a source for it.
# status: current  -> the agent may cite it
# status: retired  -> the agent must refuse it and point to the replacement
# status: draft    -> not yet approved; the agent must refuse it
#
# Every file in canon/ must appear here. A file not in the registry is not canon.

